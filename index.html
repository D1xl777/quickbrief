<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0d">
  <meta name="description" content="Answer with a number. The closer you are, the more points you get.">
  <title>CLOSE ENOUGH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- START -->
  <section id="s-start" class="screen">
    <div class="grow center">
      <h1 class="logo">CLOSE<br>ENOUGH</h1>
      <p id="tagline" class="tagline">Answer with a number. The closer you are, the more points you get.</p>
      <div id="challenge-banner" class="banner" hidden>FRIEND TO BEAT: <b id="cb-name"></b> — <b id="cb-score"></b></div>
    </div>
    <div class="stack">
      <button id="btn-challenge" class="btn primary" hidden>PLAY CHALLENGE</button>
      <button id="btn-daily" class="btn primary">DAILY</button>
      <button id="btn-practice" class="btn">PRACTICE</button>
      <div class="row settings">
        <input id="name" class="field" maxlength="12" placeholder="Your name" autocomplete="nickname" spellcheck="false">
        <div class="seg" role="group" aria-label="Voice language">
          <button data-lang="en-US">EN</button><button data-lang="ru-RU">RU</button>
        </div>
      </div>
    </div>
  </section>

  <!-- QUESTION -->
  <section id="s-q" class="screen" hidden>
    <header class="hud">
      <button id="btn-quit" class="x" aria-label="Quit">✕</button>
      <span id="q-idx">1/5</span>
      <span id="q-total" class="dim">0</span>
    </header>
    <div class="timer"><div id="timer-bar"></div></div>
    <div class="grow center">
      <div id="q-time" class="time">20</div>
      <h2 id="q-text" class="qtext"></h2>
      <div id="q-unit" class="unit"></div>
    </div>
    <div id="live" class="live"></div>
    <div class="answer">
      <button id="mic" class="mic" aria-label="Hold or tap to speak">
        <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.59a6 6 0 0 0 5-5.91Z"/></svg>
      </button>
      <form id="type-form" class="row" autocomplete="off">
        <input id="num" class="field num" inputmode="decimal" enterkeyhint="go" placeholder="Type a number" spellcheck="false">
        <button class="btn primary go" type="submit">GO</button>
      </form>
    </div>
    <div id="heard" class="heard" hidden>
      <div class="dim">I heard:</div>
      <div id="heard-num" class="big"></div>
      <div class="row">
        <button id="h-ok" class="btn primary">OK</button>
        <button id="h-repeat" class="btn">Repeat</button>
        <button id="h-type" class="btn">Type it</button>
      </div>
    </div>
  </section>

  <!-- REVEAL -->
  <section id="s-reveal" class="screen" hidden>
    <div class="grow center">
      <div id="r-truth" class="big"></div>
      <div id="r-unit" class="unit"></div>
      <div id="r-you" class="you"></div>
      <div id="r-points" class="points"></div>
      <div class="bar"><div id="r-bar" class="fill"></div></div>
      <p id="r-fact" class="fact"></p>
    </div>
    <div class="stack">
      <div id="r-strip" class="strip small"></div>
      <button id="btn-next" class="btn primary">NEXT</button>
    </div>
  </section>

  <!-- END -->
  <section id="s-end" class="screen" hidden>
    <div class="grow center">
      <div id="e-mode" class="dim"></div>
      <div class="label">SCORE: <span id="e-score" class="score"></span></div>
      <div id="e-new" class="newbest" hidden>NEW BEST</div>
      <div id="e-strip" class="strip"></div>
      <div class="label sub">BEST: <span id="e-best"></span></div>
      <div id="e-friend" class="label sub friend" hidden>FRIEND TO BEAT: <span id="e-friend-name"></span> — <span id="e-friend-score"></span> <span id="e-gap" class="gap"></span></div>
    </div>
    <div class="row three">
      <button id="btn-again" class="btn">TRY AGAIN</button>
      <button id="btn-share" class="btn primary">SHARE</button>
      <button id="btn-end-daily" class="btn">DAILY</button>
    </div>
  </section>

  <div id="toast" class="toast" hidden></div>
</main>
<script src="game.js"></script>
</body>
</html>
